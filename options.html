<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FilmoviPlex Cleaner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
        }

        .domain {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 6px;
        }

        .domain-name {
            flex: 1;
            font-family: monospace;
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            padding: 8px 14px;
        }

        .remove {
            background: #e53935;
            color: white;
        }

        .add {
            background: #1976d2;
            color: white;
        }

        .reset {
            background: #555;
            color: white;
        }

        input {
            padding: 9px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .big-number {
            font-size: 36px;
            font-weight: bold;
        }

        .muted {
            color: #777;
        }

        #message {
            margin-top: 15px;
            color: #1976d2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛡 FilmoviPlex Cleaner</h1>

    <p>
        Domains blocked by the extension:
    </p>

    <div id="domains"></div>

    <div style="margin-top:20px">

        <input
            id="domainInput"
            type="text"
            placeholder="example.com"
        >

        <button class="add" id="addDomain">
            + Add domain
        </button>

    </div>

    <div id="message"></div>


    <div class="stats">

        <h2>Statistics</h2>

        <div class="big-number" id="totalBlocked">
            0
        </div>

        <div>
            blocked popups
        </div>

        <p class="muted" id="lastBlocked">
            No blocks recorded yet.
        </p>

        <h3>By domain</h3>

        <div id="domainStats"></div>

        <br>

        <button class="reset" id="resetStats">
            Reset counters
        </button>

    </div>

</div>

<script src="options.js"></script>

</body>
</html>
