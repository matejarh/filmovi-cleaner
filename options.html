<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FilmoviPlex Cleaner</title>

    <style>
        :root {
            --bg: #f5f5f5;
            --panel: #ffffff;
            --panel-alt: #f1f1f1;
            --text: #222222;
            --muted: #777777;
            --border: #dddddd;
            --input-bg: #ffffff;
            --input-border: #cccccc;
            --accent: #1976d2;
            --danger: #e53935;
            --reset: #555555;
            --shadow: rgba(0, 0, 0, 0.08);
            --message: #1976d2;
        }

        :root[data-theme="dark"] {
            --bg: #111827;
            --panel: #1f2937;
            --panel-alt: #2b3443;
            --text: #f3f4f6;
            --muted: #bcc6d5;
            --border: #3b4759;
            --input-bg: #111827;
            --input-border: #475569;
            --accent: #60a5fa;
            --danger: #f87171;
            --reset: #94a3b8;
            --shadow: rgba(0, 0, 0, 0.32);
            --message: #93c5fd;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background: var(--bg);
            color: var(--text);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .container {
            background: var(--panel);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 10px var(--shadow);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0;
        }

        h1 img {
            display: block;
            width: 32px;
            height: 32px;
        }

        .domain {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            padding: 10px;
            background: var(--panel-alt);
            border-radius: 6px;
        }

        .domain-name {
            flex: 1;
            font-family: monospace;
            color: var(--text);
        }

        button {
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            padding: 8px 14px;
            transition: opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.95;
        }

        .remove {
            background: var(--danger);
            color: white;
        }

        .add {
            background: var(--accent);
            color: white;
        }

        .reset {
            background: var(--reset);
            color: white;
        }

        .theme-toggle {
            background: var(--panel-alt);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: bold;
            white-space: nowrap;
        }

        select {
            padding: 6px 8px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
        }

        input {
            padding: 9px;
            width: 300px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text);
        }

        input::placeholder {
            color: var(--muted);
        }

        .blocking-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
        }

        .blocking-toggle input {
            appearance: none;
            position: relative;
            flex: 0 0 40px;
            width: 40px;
            height: 22px;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 11px;
            background: #c62828;
            cursor: pointer;
        }

        .blocking-toggle input::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s ease;
        }

        .blocking-toggle input:checked {
            background: #218739;
        }

        .blocking-toggle input:checked::before {
            transform: translateX(18px);
        }

        .blocking-toggle input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .stats {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .big-number {
            font-size: 36px;
            font-weight: bold;
        }

        .exact-count {
            color: var(--muted);
            font-size: 14px;
            font-weight: normal;
        }

        .muted {
            color: var(--muted);
        }

        .clickable-domain {
            background: none;
            border: 0;
            padding: 0;
            color: var(--accent);
            text-decoration: underline;
            cursor: pointer;
            font: inherit;
        }

        #message {
            margin-top: 15px;
            color: var(--message);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header-row">
        <h1><img src="icons/icon128.png" width="32" height="32" alt="Icon"> FilmoviPlex Cleaner</h1>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">🌙 Dark</button>
    </div>

    <label class="blocking-toggle">
        <input id="blockingEnabled" type="checkbox" role="switch" checked>
        <span id="blockingStatus">Blocking enabled</span>
    </label>

    <p>
        Domains blocked by the extension:
    </p>

    <div id="domains"></div>

    <div style="margin-top:20px">

        <input
            id="domainInput"
            type="text"
            placeholder="example.com"
            aria-label="Domain or URL to block"
        >

        <button class="add" id="addDomain">
            + Add domain
        </button>

    </div>

    <div id="message" role="status" aria-live="polite"></div>


    <div class="stats">

        <h2>Statistics</h2>

        <div class="big-number">
            <span id="totalBlocked">0</span> <span class="exact-count" id="exactBlocked">(0)</span>
        </div>

        <div>
            blocked requests and popups
        </div>

        <p class="muted">Network blocks are counted only when the extension is loaded unpacked.</p>

        <p class="muted" id="lastBlocked">
            No blocks recorded yet.
        </p>

        <p class="muted">
            Date format:
            <select id="dateLocale">
                <option value="">Browser default</option>
                <option value="sl-SI">Slovenian (sl-SI)</option>
                <option value="hr-HR">Croatian (hr-HR)</option>
                <option value="en-GB">English UK (en-GB)</option>
                <option value="en-US">English US (en-US)</option>
                <option value="de-DE">German (de-DE)</option>
            </select>
        </p>

        <p class="muted" id="lastBlockedDomainText">
            Last blocked domain: none
        </p>

        <p class="muted" id="lastPopupDomainText">
            Last unblocked popup domain: none
        </p>

        <h3>By domain</h3>

        <div id="domainStats"></div>

        <br>

        <button class="reset" id="resetStats">
            Reset counters
        </button>

    </div>

</div>

<script src="format.js"></script>
<script src="options.js"></script>

</body>
</html>
